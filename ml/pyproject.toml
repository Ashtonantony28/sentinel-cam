[project]
name = "sentinel-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17", "numpy>=1.24", "pyyaml", "pillow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
markers = ["slow: longer end-to-end tests (still run by `make test`)"]
