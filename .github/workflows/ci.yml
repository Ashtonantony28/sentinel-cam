name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test (all workstreams + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            tools/requirements.txt
            hardware/requirements.txt
            backend/requirements*.txt
            fl/requirements*.txt
            tests/integration/requirements.txt
      - name: System packages (cmake, clang for the M55/RV32 cross-compile checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang llvm
      # ml/, tools/ and hardware/ run on the job's interpreter; backend/, fl/ and
      # tests/integration build their own .venv from their Makefiles.
      - name: Python deps for ml, tools, hardware
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements.txt -r tools/requirements.txt -r hardware/requirements.txt
      - name: make test
        run: make test
      - name: Generated firmware power model is fresh
        run: python tools/gen_fw_power_model.py --check

  ota-soak:
    name: OTA power-cut fault-injection soak (extra seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 20261107]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: Fault-injection soak, seed ${{ matrix.seed }}
        run: make -C tools fault-soak RUNS=5000 SEED=${{ matrix.seed }}
