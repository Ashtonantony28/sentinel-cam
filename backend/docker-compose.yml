# Self-hosted Sentinel backend (plan §3.3). Not used by tests.
# Before first start: put the CA, broker server cert/key and the backend's client cert/key in
# deploy/certs/ (see README "Security model"), and create .env with SENTINEL_DEVICE_SECRET,
# SENTINEL_API_TOKEN_SHA256, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["8883:8883"]
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9001:9001"]
    restart: unless-stopped

  api:
    build: .
    depends_on: [mosquitto, minio]
    environment:
      SENTINEL_DB: /data/sentinel.db
      SENTINEL_STORAGE: s3
      SENTINEL_S3_BUCKET: sentinel-clips
      SENTINEL_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SENTINEL_API_TOKEN_SHA256: ${SENTINEL_API_TOKEN_SHA256}
      SENTINEL_DEVICE_SECRET: ${SENTINEL_DEVICE_SECRET}
      SENTINEL_MQTT_HOST: mosquitto
      SENTINEL_MQTT_PORT: "8883"
      SENTINEL_MQTT_CA: /certs/ca.crt
      SENTINEL_MQTT_CERT: /certs/backend.crt
      SENTINEL_MQTT_KEY: /certs/backend.key
    volumes:
      - api-data:/data
      - ./deploy/certs:/certs:ro
    ports: ["8000:8000"]   # put behind a TLS reverse proxy in production
    restart: unless-stopped

volumes:
  mosquitto-data:
  minio-data:
  api-data:
